<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <meta name="description" content="Choose Eaglercraft 1.12.2 or 26.2 to launch in your browser.">
  <title>Eaglercraft Launcher</title>
  <style>
    :root{color-scheme:dark;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#10141c;color:#f2f5fa}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#25314b 0,transparent 58%),#10141c}
    main{width:min(760px,100%);padding:clamp(24px,6vw,54px);border:1px solid #ffffff1b;border-radius:24px;background:#141a24d9;box-shadow:0 28px 90px #0007;backdrop-filter:blur(18px)}
    .eyebrow{font-size:11px;font-weight:750;letter-spacing:.18em;text-transform:uppercase;color:#a9c8ff}
    h1{margin:10px 0 8px;font-size:clamp(32px,7vw,52px);line-height:1.05;letter-spacing:-.045em}
    .intro{margin:0;color:#aab4c4}
    .versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:32px}
    .version{display:flex;min-height:160px;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:20px;border:1px solid #ffffff1b;border-radius:16px;background:linear-gradient(145deg,#202b3d,#171d28);color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,background .18s}
    .version:hover,.version:focus-visible{transform:translateY(-3px);border-color:#8db5ff88;background:linear-gradient(145deg,#293850,#1a2230);outline:none}
    .version small{color:#aab4c4;font-size:12px}
    .version strong{display:block;margin-top:8px;font-size:20px;letter-spacing:-.025em}
    .launch{color:#a9c8ff;font-size:13px;font-weight:700}
    footer{margin-top:24px;color:#788394;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Eaglercraft launcher</div>
    <h1>Pick your edition</h1>
    <p class="intro">Choose Eaglercraft 1.12.2 or 26.2 and launch it right here.</p>
    <nav class="versions" aria-label="Game versions">
      <a class="version" href="./eaglercraft-1.12.2.html">
        <span><small>Classic edition</small><strong>1.12.2</strong></span>
        <span class="launch">Launch game ↗</span>
      </a>
      <a class="version" href="./eaglercraft26-2.html">
        <span><small>Offline edition</small><strong>26.2</strong></span>
        <span class="launch">Launch game ↗</span>
      </a>
    </nav>
    <footer>Games launch as separate pages.</footer>
  </main>
</body>
</html>
